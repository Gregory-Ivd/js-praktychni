<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практична Тема №7 Додаткове завдання Йовдій Г.Г. ЗІПЗ-26-1</title>
</head>
<body>

  <h1>Практична Тема №7 Додаткове завдання Йовдій Г.Г. ЗІПЗ-26-1</h1>
  <p>Цикли. Додаткове завдання</p>

  <h2>Додаткове завдання — привітання «Слава Україні!»</h2>
  <p>Скільки привітань потрібно? Потім «Героям слава» стільки ж разів.</p>
  <script>
    // Що я роблю:
    // 1) питаю, скільки привітань потрібно;
    // 2) виводжу стільки рядків «Слава Україні!» з номерами;
    // 3) у кінці пишу «Героям слава N раз» і узгоджую слово «раз» з числом.

    // Покроково: 1. Питаю користувача. Відповідь prompt відображається як текст.
    // Якщо користувач натиснув Cancel, у змінну має потрапити null (тобто «нічого»).
    let greetText = prompt("Скільки привітань ви хочете отримати?", "");

    // Крок 2. Перевіряю, чи не Cancel.
    if (greetText == null) {
      document.write("<p>Введення скасовано.</p>");
    } else {
      // Крок 3. Перетворюю текст на число. Плюс перед змінною робить це.
      let greetCount = +greetText;

      // Крок 4. Перевіряю кількість: вона має бути не меншою за 1 і цілою.
      // Порожній рядок дає 0, а слово дає NaN («не число»): обидва не пройдуть умову >= 1.
      // Остача від ділення на 1 дорівнює 0 лише для цілих чисел (у 2.5 вона 0.5).
      if (greetCount >= 1 && greetCount % 1 === 0) {

        // Крок 5. Цикл. Лічильник g починається з 1.
        // Поки g не більше за greetCount, виводжу рядок і збільшую g на 1.
        for (let g = 1; g <= greetCount; g++) {
          document.write("<p>" + g + ". Слава Україні!</p>");
        }

        // Крок 6. Підбираю правильне слово. Воно залежить від кінця числа.
        // % дає остачу від ділення: 25 % 10 = 5, 25 % 100 = 25.
        let lastDigit = greetCount % 10;   // остання цифра числа
        let lastTwo = greetCount % 100;     // останні дві цифри числа
        let timesWord;                      // тут буде слово: раз, рази або разів

        if (lastTwo >= 11 && lastTwo <= 14) {
          // числа 11, 12, 13, 14 (і 111, 112...) завжди «разів»
          timesWord = "разів";
        } else if (lastDigit === 1) {
          // 1, 21, 101 -> «раз»
          timesWord = "раз";
        } else if (lastDigit >= 2 && lastDigit <= 4) {
          // 2, 3, 4, 22, 23 -> «рази»
          timesWord = "рази";
        } else {
          // усі інші: 5, 6, 10, 25 -> «разів»
          timesWord = "разів";
        }

        // Крок 7. Виводжу фінальний рядок.
        document.write("<p>Героям слава " + greetCount + " " + timesWord + "!</p>");

      } else {
        document.write("<p>Потрібне ціле число, не менше 1.</p>");
      }
    }
  </script>
</body>
</html>
